name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Check generated Worker types are up to date
        run: npm run cf-typegen && git diff --exit-code -- src/worker/worker-configuration.d.ts
      - name: Lint (ESLint, Prettier, invisible characters)
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit + Worker tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Bundle size budget (first-load JS <= 60 KB gzip)
        run: |
          size=$(cat dist/client/assets/index-*.js | gzip -9 | wc -c)
          echo "first-load JS: $size bytes gzipped"
          test "$size" -le 61440
      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
