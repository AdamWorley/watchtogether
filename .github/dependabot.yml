version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*', 'prettier-plugin-svelte', 'eslint-plugin-svelte']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
