name: Preview cleanup

# Delete a PR's Worker Preview (code, Durable Object storage) once the PR is merged or closed.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    name: Delete Preview
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A PR that never got a Preview (e.g. CI failed) has nothing to delete; that's fine.
      - run: npx wrangler preview delete --name "pr-$PR" --skip-confirmation || echo "no Preview to delete"
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
